<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>선재야 돌아와</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  background: #111;
}
body {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, #ff8bd1 0 8%, transparent 25%),
    radial-gradient(circle at 80% 25%, #7cf7ff 0 7%, transparent 25%),
    radial-gradient(circle at 30% 85%, #b98cff 0 8%, transparent 27%),
    radial-gradient(circle at 85% 85%, #fff06b 0 7%, transparent 25%),
    #111;
}
.stars {
  position: fixed;
  inset: 0;
  background-image:
    radial-gradient(white 1px, transparent 1px),
    radial-gradient(white 1px, transparent 1px);
  background-size: 47px 53px, 83px 91px;
  background-position: 0 0, 20px 30px;
  opacity: .35;
  animation: drift 8s linear infinite;
}
#gift-screen {
  position: relative;
  z-index: 10;
  text-align: center;
  cursor: pointer;
}
.gift-box {
  font-size: 110px;
  animation: bounce 1.2s infinite alternate, shake 2s infinite ease-in-out;
  filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.8));
  user-select: none;
}
.gift-text {
  margin-top: 20px;
  color: #fff;
  font-size: 24px;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
  animation: pulse 1s infinite alternate;
}
.box {
  display: none;
  position: relative;
  z-index: 5;
  text-align: center;
  padding: 50px 30px;
  width: min(92vw, 650px);
  border: 3px solid rgba(255,255,255,.8);
  border-radius: 30px;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(8px);
  box-shadow: 0 0 50px rgba(255, 255, 255, 0.5);
  transform: scale(0);
}
.box.show {
  display: block;
  animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}
.alert {
  font-size: clamp(18px, 4.5vw, 28px);
  font-weight: 900;
  color: #ffed4a;
  letter-spacing: 3px;
  animation: blink .7s infinite alternate;
}
h1 {
  margin: 25px 0 20px;
  font-size: clamp(48px, 14vw, 105px);
  font-weight: 1000;
  line-height: 1.05;
  background: linear-gradient(
    90deg,
    #ff3b3b, #ff9d00, #fff23b, #46ff68,
    #36eaff, #6875ff, #d45cff, #ff4ecb, #ff3b3b
  );
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: rainbow 2s linear infinite, wobble 1.5s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(255,255,255,.5));
}
.sub {
  color: #ffffff;
  font-size: clamp(18px, 4.5vw, 24px);
  font-weight: 800;
  margin-top: 15px;
  letter-spacing: 1px;
}
@keyframes popIn {
  0% { transform: scale(0) rotate(-10deg); opacity: 0; }
  80% { transform: scale(1.08) rotate(3deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-20px); }
}
@keyframes shake {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-8deg); }
  40% { transform: rotate(8deg); }
  60% { transform: rotate(-5deg); }
  80% { transform: rotate(5deg); }
}
@keyframes pulse {
  from { opacity: 0.6; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1.02); }
}
@keyframes rainbow {
  to { background-position: 300% center; }
}
@keyframes wobble {
  0%,100% { transform: rotate(-3deg) scale(1); }
  50% { transform: rotate(3deg) scale(1.05); }
}
@keyframes blink {
  from { opacity: .55; }
  to { opacity: 1; }
}
@keyframes drift {
  from { transform: translate(0,0); }
  to { transform: translate(30px,20px); }
}
canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 99;
}
</style>
</head>
<body>
<div class="stars"></div>
<canvas id="confetti"></canvas>
<div id="gift-screen" onclick="openGift()">
  <div class="gift-box">🎁</div>
  <div class="gift-text">눌러봐</div>
</div>
<main class="box" id="main-box">
  <div class="alert">우리가 잘못했어</div>
  <h1>선재야<br>돌아와</h1>
  <div class="sub">사가방에게 돌아와</div>
</main>
<script>
function openGift() {
  document.getElementById('gift-screen').style.display = 'none';
  const mainBox = document.getElementById('main-box');
  mainBox.classList.add('show');
  startConfetti();
}

function startConfetti() {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = [];
  const colors = ['#ff3b3b', '#ff9d00', '#fff23b', '#46ff68', '#36eaff', '#6875ff', '#d45cff'];
  for (let i = 0; i < 150; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 25,
      vy: (Math.random() - 0.5) * 25 - 6,
      size: Math.random() * 9 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1
    });
  }
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.35;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });
    if (alive) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  animate();
}
</script>
</body>
</html>
